- title: "Bound Verifiable Presentation (BoundVP): Binding Wallet Presentations to Browser Sessions"
  url: https://medium.com/@kapildewade_52733/bound-verifiable-presentation-boundvp-binding-wallet-presentations-to-browser-sessions-949a6b710f84
  date: 2026-10-18
  venue: Medium
  coauthors: [Kaustubh Khatri]
  topics: [Identity, Protocol design]
  status: Experimental protocol proposal
  status_note: Design under evaluation; not peer-reviewed or standardized.
  featured: true
  summary: >-
    A protocol design study of session fixation in cross-device identity flows,
    where a valid wallet presentation can still sign in the wrong browser. BoundVP
    proposes binding the presentation to the browser session that started it. The
    article sets out its limits and open questions, and a prototype has not yet been built.

